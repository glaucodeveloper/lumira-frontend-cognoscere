name: Publicar apresentação no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Configurar chave PTA da apresentação
        env:
          PTA_ACCESS_KEY: ${{ secrets.PTA_ACCESS_KEY }}
        run: |
          if [ -z "$PTA_ACCESS_KEY" ]; then
            echo "::warning::PTA_ACCESS_KEY não configurado; usando a chave compartilhada de demonstração já prevista no código."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const normalized = process.env.PTA_ACCESS_KEY
            .normalize('NFKC')
            .replace(/[\u200B-\u200D\uFEFF]/g, '')
            .trim()
            .toUpperCase()
            .replace(/[\u2010-\u2015\u2212]/g, '-')
            .replace(/\s*-\s*/g, '-')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-');
          if (!normalized) throw new Error('O secret PTA_ACCESS_KEY está vazio.');
          const digest = createHash('sha256').update(normalized, 'utf8').digest('hex');
          appendFileSync(process.env.GITHUB_ENV, `VITE_PTA_ACCESS_KEY_SHA256=${digest}\n`);
          NODE
      - name: Verificar tipos
        run: npm run typecheck
      - name: Gerar apresentação estática
        run: npx vite build
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
